<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Booboo's Town</title>
<meta name="description" content="Booboo the pink monkey drives around town: the water cycle, rainbows and light, planets, big numbers and first coding.">
<meta name="theme-color" content="#ffd1e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Booboo's Town game"></svg>
<div id="caption" hidden></div>
<button id="gear" aria-label="Grown-ups (hold)">⚙</button>

<div id="parent" hidden>
  <div class="card">
    <h2>Grown-ups</h2>
    <h3>Challenge level</h3>
    <div id="pLevel" class="seg">
      <button data-level="sprout"><b>🌱 Sprout</b><span>about age 3: counting on, tens, simple choices</span></button>
      <button data-level="explorer"><b>🧭 Explorer</b><span>about age 4: ±10, place value, recall the order</span></button>
      <button data-level="scientist"><b>🔬 Scientist</b><span>about age 5+: adding tens, differences, turn-based coding, 3-clue riddles</span></button>
    </div>
    <h3>Sound</h3>
    <label class="row"><input type="checkbox" id="pVoice"> Talking voice</label>
    <label class="row">Voice <select id="pMode"><option value="booboo">Booboo's voice (natural, recorded)</option><option value="device">This device's voice</option></select> <button id="pTest" type="button">Test</button></label>
    <label class="row" id="pVoiceRow">Device voice <select id="pVoiceSel"></select></label>
    <label class="row">Talking speed <input type="range" id="pRate" min="0.7" max="1.2" step="0.05"></label>
    <label class="row"><input type="checkbox" id="pSfx"> Sound effects</label>
    <p class="small">Booboo's voice is recorded ahead of time, so it sounds natural on every phone. Only if you pick the device voice: names with “Natural”, “Google” or “Enhanced” sound least robotic.</p>
    <h3>Progress</h3>
    <p id="pStats" class="small"></p>
    <div class="btns"><button id="pReset" type="button">Reset progress</button><button id="pClose" type="button" class="primary">Done</button></div>
  </div>
</div>

<div id="rotate"><div>📱↻<br>Turn the phone sideways<br><small>(tap to keep playing)</small></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
